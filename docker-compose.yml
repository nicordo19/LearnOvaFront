services:
  database:
    image: postgres:14.8
    container_name: rncp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - rncp-network

  # --------------------------
  # Backend Spring Boot
  # --------------------------
  backend:
    env_file:
      - .env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rncp-backend
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - database
    networks:
      - rncp-network

  # --------------------------
  # Frontend Angular
  # --------------------------
  frontend:
    build:
      context: .
    container_name: rncp-frontend
    ports:
      - '4200:80'
    depends_on:
      - backend
    networks:
      - rncp-network

volumes:
  postgres_data:

networks:
  rncp-network:
