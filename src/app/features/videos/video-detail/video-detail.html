<section class="video-detail">
  <a class="back-link" routerLink="/" aria-label="Retour aux vidéos">
    <span aria-hidden="true">←</span>
    Retour aux vidéos
  </a>

  <div *ngIf="loading" class="detail-state">
    <p>Chargement de la vidéo...</p>
  </div>

  <div *ngIf="error && !loading" class="detail-state error-message">
    <p>{{ error }}</p>
  </div>

  <article class="video-watch" *ngIf="video && !loading && !error">
    <div class="watch-player">
      <video
        *ngIf="getVideoSource(video) as videoSource"
        [src]="videoSource"
        controls
        autoplay
        playsinline
      ></video>
    </div>

    <div class="watch-content">
      <h1>{{ video.title || 'Cours vidéo' }}</h1>

      <div class="watch-meta">
        <span>{{ getUploaderName(video) }}</span>
        <span>{{ video.createdAt | date: 'dd/MM/yyyy' }}</span>
      </div>

      <p class="watch-description" *ngIf="video.description">{{ video.description }}</p>
    </div>
  </article>
</section>
